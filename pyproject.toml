[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tradeguard"
version = "0.2.0"
description = "Read-only equity/ETF research and offline index futures/European-options analysis for Hermes"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["tradeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
