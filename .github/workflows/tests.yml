name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official ref
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check research references
        run: python scripts/check_research_integrity.py
      - name: Exercise offline derivative CLI and native parity
        run: python scripts/exercise_derivatives_offline.py --output artifacts/derivatives_offline_integration.json
      - name: Exercise CLI discovery without networking
        run: |
          python -m tradeguard --help
          python -m tradeguard strategies --strategy-id trend_following
